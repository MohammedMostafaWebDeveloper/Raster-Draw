<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raster Draw</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar">
        <div id="logo-con">
            <img src="assets/logo.png" id="logo">
            Raster Draw
            <vl></vl>
            <input id="project-name" placeholder="Untitled Project">
        </div>
        <div id="edit">
            <button id="undo" onclick="undo()"><img src="assets/Undo.svg" id="undo-icon"></button>
            <button id="redo" onclick="redo()"><img src="assets/Redo.svg" id="redo-icon"></button>
        </div>
        <div id="export-con">
            <button class="export">File</button>
            <button class="export" onclick="showResize()">Resize</button>
            <button class="export colored" onclick="showExport()"><img src="assets/Export.svg">Export</button>
        </div>
    </div>
    <div id="content">
        <div id="toolbar">
            <div id="tools">
                <button class="tool-btn" id="move"><img src="assets/Move.svg" class="tool-icon"></button>
                <button class="tool-btn" id="select"><img src="assets/Rectangle Select.svg" class="tool-icon"></button>
                <button class="tool-btn selected" id="pencil"><img src="assets/Pencil.svg" class="tool-icon"></button>
                <button class="tool-btn" id="fill"><img src="assets/Fill.svg" class="tool-icon"></button>
                <button class="tool-btn" id="eraser"><img src="assets/Eraser.svg" class="tool-icon"></button>
                <button class="tool-btn" id="line"><img src="assets/Line.svg" class="tool-icon"></button>
                <button class="tool-btn" id="circle"><img src="assets/Circle.svg" class="tool-icon"></button>
                <button class="tool-btn" id="rectangle"><img src="assets/Rectangle.svg" class="tool-icon"></button>
                <button class="tool-btn" id="dropper"><img src="assets/Eye dropper.svg" class="tool-icon"></button>
                <button class="tool-btn" id="hand"><img src="assets/Hand.svg" class="tool-icon"></button>
                <button class="tool-btn" id="zoom"><img src="assets/Zoom.svg" class="tool-icon"></button>
            </div>
            <div id="colors-con">
                <input type="color" id="secondary-color" class="color" value="#ffffff">
                <input type="color" id="primary-color" class="color">
                <button id="swap-colors" onclick="swap_colors()"><img src="assets/Swap.svg" id="swap-icon"></button>
            </div>
        </div>
        <div id="middle">
            <div id="editor">
                <canvas id="background"></canvas>
                <canvas id="before"></canvas>
                <canvas id="after"></canvas>
                <div id="layers">
                    <canvas id="layer1"></canvas>
                    <canvas id="selection"></canvas>
                </div>
                <canvas id="effects"></canvas>
                <canvas id="selection-canvas"></canvas>
                <canvas id="trace"></canvas>
                <button id="deselect" onclick="deselect()">Deselect</button>
            </div>
            <div id="keyframes">
                <div id="keyframes-tools">
                    <div id="timeline-tools">
                        <button class="layer-tool" onclick="backward()"><img src="assets/Backward.svg"></button>
                        <button class="layer-tool" onclick="backwardStep()"><img style="scale: 0.9;" src="assets/Backward Step.svg"></button>
                        <button class="layer-tool paused" id="play-pause-btn" onclick="playPause(this)"><img style="scale: 0.9;" src="assets/Play.svg"></button>
                        <button class="layer-tool" onclick="forwardStep()"><img style="scale: 0.9;" src="assets/Forward Step.svg"></button>
                        <button class="layer-tool" onclick="forward()"><img src="assets/Forward.svg"></button>
                    </div>
                    <div id="delay-con">
                        Delay :
                        <select id="delay" onchange="changeDelay()">
                            <option value="40">40 ms</option>
                            <option value="60">60 ms</option>
                            <option value="80">80 ms</option>
                            <option value="100" selected>100 ms</option>
                            <option value="120">120 ms</option>
                            <option value="140">140 ms</option>
                            <option value="160">160 ms</option>
                        </select>
                    </div>
                    <div id="edit-tools">
                        <button class="layer-tool" onclick="addFrame()"><img src="assets/Add.svg"></button>
                        <button class="layer-tool" onclick="dublicateFrame()"><img src="assets/Dublicate.svg"></button>
                        <button class="layer-tool" onclick="removeFrame()"><img src="assets/Delete.svg"></button>
                    </div>
                </div>
                <div id="clips">
                    <div class="clip active-frame" id="frame1" draggable="true" onclick="changeKeyframe(this)" ondragstart="startDrag(this)" ondragend="endDrag(this); updateKeyframes()">1</div>
                </div>
            </div>
        </div>
        
        <div id="rightbar">
            <div class="bar-title">Tool Options</div>
            <div id="custbar">
                <div id="move-cust" class="cust-con" style="display: none;">
                    No options available
                </div>
                <div id="select-cust" class="cust-con" style="display: none;">
                    <div class="cust-title">
                        <input type="radio" id="rectangle-select-option" name="select-tool" checked onchange="changeSelectIcon()"><label for="rectangle-select-option" class="option"><img src="assets/Rectangle Select.svg"></label>
                        <input type="radio" id="circle-select-option" name="select-tool" onchange="changeSelectIcon()"><label for="circle-select-option" class="option"><img src="assets/Circle Select.svg"></label>
                        <input type="radio" id="lasso-select-option" name="select-tool" onchange="changeSelectIcon()"><label for="lasso-select-option" class="option"><img src="assets/Lasso Select.svg"></label>
                    </div>
                    <hr>
                    <div class="cust-title">
                        <input type="radio" id="normal-mode" name="select-mode" checked><label for="normal-mode" class="option"><img style="scale: 0.8;" src="assets/Square.svg"></label>
                        <input type="radio" id="union-mode" name="select-mode"><label for="union-mode" class="option"><img src="assets/Union.svg"></label>
                        <input type="radio" id="subtract-mode" name="select-mode"><label for="subtract-mode" class="option"><img src="assets/Subtract.svg"></label>
                        <input type="radio" id="intersect-mode" name="select-mode"><label for="intersect-mode" class="option"><img src="assets/Intersect.svg"></label>
                        <input type="radio" id="exclude-mode" name="select-mode"><label for="exclude-mode" class="option"><img src="assets/Exclude.svg"></label>
                    </div>
                </div>
                <div id="pencil-cust" class="cust-con">
                    <div class="cust-title">
                        <label>Size :</label><input type="number" class="size-number" min="1" max="1000" value="1">
                    </div>
                    <input type="range" class="size-range" min="1" max="100" value="1">
                    <hr>
                    <div class="cust-title">
                        <label>Alpha :</label><input type="number" class="alpha-number" min="0" max="255" value="255">
                    </div>
                    <input type="range" class="alpha-range" min="0" max="255" value="255">
                    <hr>
                    <div class="cust-title">
                        <label>Soft Brush : </label><input type="checkbox" class="soft-checkbox">
                    </div>
                </div>
                <div id="fill-cust" class="cust-con" style="display: none;">
                    <div class="cust-title">
                        <label class="tolerance-label">Tolerance :</label><input type="number" class="tolerance-number" min="0" max="100" value="50">
                    </div>
                    <input type="range" class="tolerance-range" min="0" max="100" value="50">
                    <hr>
                    <div class="cust-title">
                        <label class="alpha-label">Alpha :</label><input type="number" class="alpha-number" min="0" max="255" value="255">
                    </div>
                    <input type="range" class="alpha-range" min="0" max="255" value="255">
                    <hr>
                    <div class="cust-title">
                        <label>Ignore other layers : </label><input type="checkbox" class="ignore-checkbox">
                    </div>
                    <hr>
                </div>
                <div id="eraser-cust" class="cust-con" style="display: none;">
                    <div class="cust-title">
                        <label class="size-label">Size :</label><input type="number" class="size-number" min="1" max="1000" value="1">
                    </div>
                    <input type="range" class="size-range" min="1" max="100" value="1">
                    <hr>
                    <div class="cust-title">
                        <label class="alpha-label">Alpha :</label><input type="number" class="alpha-number" min="0" max="255" value="255">
                    </div>
                    <input type="range" class="alpha-range" min="0" max="255" value="255">
                    <hr>
                    <div class="cust-title">
                        <label>Soft Brush : </label><input type="checkbox" class="soft-checkbox">
                    </div>
                </div>
                <div id="line-cust" class="cust-con" style="display: none;">
                    <div class="cust-title">
                        <label class="size-label">Thickness :</label><input type="number" class="thickness-number" min="1" max="1000" value="1">
                    </div>
                    <input type="range" class="thickness-range" min="1" max="100" value="1">
                    <hr>
                    <div class="cust-title">
                        <label class="alpha-label">Alpha :</label><input type="number" class="alpha-number" min="0" max="255" value="255">
                    </div>
                    <input type="range" class="alpha-range" min="0" max="255" value="255">
                </div>
                <div id="circle-cust" class="cust-con" style="display: none;">
                    <div class="cust-title">
                        <label class="size-label">Thickness :</label><input type="number" class="thickness-number" min="1" max="1000" value="1">
                    </div>
                    <input type="range" class="thickness-range" min="1" max="100" value="1">
                    <hr>
                    <div class="cust-title">
                        <label class="alpha-label">Alpha :</label><input type="number" class="alpha-number" min="0" max="255" value="255">
                    </div>
                    <input type="range" class="alpha-range" min="0" max="255" value="255">
                </div>
                <div id="rectangle-cust" class="cust-con" style="display: none;">
                    <div class="cust-title">
                        <label class="size-label">Thickness :</label><input type="number" class="thickness-number" min="1" max="1000" value="1">
                    </div>
                    <input type="range" class="thickness-range" min="1" max="100" value="1">
                    <hr>
                    <div class="cust-title">
                        <label class="alpha-label">Alpha :</label><input type="number" class="alpha-number" min="0" max="255" value="255">
                    </div>
                    <input type="range" class="alpha-range" min="0" max="255" value="255">
                </div>
                <div id="dropper-cust" class="cust-con" style="display: none;">
                    No options available
                </div>
                <div id="hand-cust" class="cust-con" style="display: none;">
                    No options available
                </div>
                <div id="zoom-cust" class="cust-con" style="display: none;">
                    <div class="cust-title">
                        <label class="zoom-label">Zoom factor :</label><input type="number" class="zoom-number" min="1" max="10" value="5">
                    </div>
                    <input type="range" class="zoom-range" min="1" max="10" value="5">
                    <hr>
                    <div class="cust-title">
                        <input type="radio" id="zoomin" name="zoom" checked><label for="zoomin" class="option"><img src="assets/Zoom In.svg"></label>
                        <input type="radio" id="zoomout" name="zoom"><label for="zoomout" class="option"><img src="assets/Zoom Out.svg"></label>
                    </div>
                </div>
            </div>
            <div class="bar-title">Mirror</div>
            <div id="mirrorbar">
                <div class="cust-con">
                    <div class="cust-title">
                        <label class="mirrorx-label">Mirror X :</label><input type="checkbox" id="mirrorx-checkbox" min="0" max="255" value="255">
                    </div>
                    <hr>
                    <div class="cust-title">
                        <label class="mirrory-label">Mirror Y :</label><input type="checkbox" id="mirrory-checkbox" min="0" max="255" value="255">
                    </div>
                </div>
            </div>
            <div class="bar-title">Layers</div>
            <div id="layersbar">
                <div class="layer-con active" id="layer-con1" onclick="changeLayer(this, event)" draggable="true" ondragstart="startDrag(this)" ondragend="endDrag(this)" ondblclick="renaming(this, event)">
                    <button class="layer-tool hide" onclick="show_hide(this)" style="height: 25px;"><img src="assets/Show.svg"></button>
                    <label class="layer-text">Layer 1</label>
                    <input class="layer-name hidden" value="Layer 1" onblur="rename(this)" onkeydown="if (event.keyCode == 13) {rename(this)}">
                </div>
            </div>
            <div id="layer-tools-con">
                <div style="display: flex;">
                    <button class="layer-tool" onclick="newLayer()"><img src="assets/Add.svg"></button>
                    <button class="layer-tool" onclick="dublicatelayer()"><img src="assets/Dublicate.svg"></button>
                    <button class="layer-tool" onclick="layerUp()"><img src="assets/Up.svg"></button>
                    <button class="layer-tool" onclick="layerDown()"><img src="assets/Down.svg"></button>
                </div>
                <button class="layer-tool" id="new-layer" onclick="deleteLayer()"><img src="assets/Delete.svg"></button>
            </div>
        </div>
    </div>
    <div id="dropper-ui"></div>
    <div class="cover" id="export-cover" onmousedown="if (event.target == this) {this.classList.add('clicked')}" onclick="hideCover(this, event)">
        <div id="export-ui">
            <div class="cust-title">
                <h3>Export Image</h3>
                <button class="layer-tool" onclick="this.closest('.cover').classList.remove('popedup')"><img src="assets/Close.svg"></button>
            </div>
            <hr>
            <label class="subtitle">Image format :</label>
            <div class="cust-title">
                <input type="radio" id="png" name="format" checked onchange="document.querySelector('#extension').innerText = '.' + this.id"><label for="png" class="option">PNG</label>
                <input type="radio" id="jpeg" name="format" onchange="document.querySelector('#extension').innerText = '.' + this.id"><label for="jpeg" class="option">JPEG</label>
                <input type="radio" id="webp" name="format" onchange="document.querySelector('#extension').innerText = '.' + this.id"><label for="webp" class="option">Webp</label>
                <input type="radio" id="avif" name="format" onchange="document.querySelector('#extension').innerText = '.' + this.id"><label for="avif" class="option">AVIF</label>
            </div>
            <hr>
            <label class="subtitle">Image scale :</label>
            <div class="cust-con" style="gap: 20px; padding: 0; flex-direction: row; justify-content: space-between; align-items: center;">
                <input style="flex: 1;" type="range" class="scale-range" min="1" max="200" value="10" oninput="updateDim(this)"><input type="number" class="scale-number" min="1" max="200" value="10" oninput="updateDim(this)">
            </div>
            <div class="cust-con" style="gap: 20px; padding: 0; flex-direction: row; justify-content: space-between; align-items: center;">
                <label>Width: <num id="width-num">100px</num> Height <num id="height-num">100px</num></label>
            </div>
            <hr>
            <label class="subtitle">File name :</label>
            <div class="cust-con" style="gap: 20px; padding: 0; flex-direction: row; justify-content: space-between; align-items: center;">
                <input class="text" id="file-name" value="Image File" placeholder=""><label id="extension">.png</label>
            </div>
            <button class="download" onclick="downloadImage()">Download Image</button>
        </div>
    </div>
    <div class="cover" id="resize-cover" onmousedown="if (event.target == this) {this.classList.add('clicked')}" onclick="hideCover(this, event)">
        <div id="resize-ui">
            <div class="cust-title">
                <h3>Resize Canvas</h3>
                <button class="layer-tool" onclick="this.closest('.cover').classList.remove('popedup')"><img src="assets/Close.svg"></button>
            </div>
            <hr>
            <div class="cust-title">
                
            </div>
            <button class="resize" onclick="resizeCanvas()">Resize</button>
        </div>
    </div>
    
    <script src="scripts/index.js"></script>
    <script src="scripts/tools.js"></script>
</body>
</html>
