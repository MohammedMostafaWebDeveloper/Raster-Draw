<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>Raster Draw | Pixel art platform</title>
    <style>
        :root{
            color-scheme: dark;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: white;
            font-family: "Quicksand", sans-serif;
            font-size: 14px;
            user-select: none;
        }
        body{
            background-color: #000000;
            height: 100vh;
            overflow-x: hidden;
        }
        .con{
            background-color: #1b1b1b;
            border: 2px solid #2e2e2e;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #upload{
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            background-color: #303030;
            padding: 25px;
            width: 100%;
            gap: 10px;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            transition: 0.2s;
        }
        #upload:hover{
            background-color: #3f3f3f;
        }
        #upload:active{
            background-color: #535353;
        }
        #upload img{
            filter: brightness(0) saturate(100%) invert(94%) sepia(0%) saturate(381%) hue-rotate(182deg) brightness(78%) contrast(90%);
            height: 30px;
        }
        #logo{
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            padding: 10px;
            background: #30303056;
            backdrop-filter: blur(7px);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 18px;
            font-weight: 700;
        }
        #logo img{
            width: 30px;
        }
        #upload .dragging{
            background-color: #3f3f3f;
        }
        #tools{
            margin-top: 100px;
            display: flex;
            justify-content: space-evenly;
        }
        .page{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #error{
            background: linear-gradient(90deg, rgba(190, 0, 0, 0.507) 0%, rgba(95, 95, 95, 0.37) 50%);
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 10px;
            gap: 10px;
            transition: 0.5s ease-in;
            translate: calc(100% + 15px) 0px;
        }
        #close{
            background-color: #00000000;
            border: none;
            outline: none;
            display: flex;
            padding: 5px;
            transition: 0.2s;
            width: fit-content;
            aspect-ratio: 1;
            border-radius: 5px;
            cursor: pointer;
        }
        #close:hover{
            background-color: #5a5a5a52;
        }
        #close img{
            width: 17px;
            filter: brightness(0) saturate(100%) invert(63%) sepia(0%) saturate(115%) hue-rotate(217deg) brightness(98%) contrast(99%);
        }
        #error-icon{
            padding: 5px;
            background-color: #e84a4a3a;
            display: flex;
            border-radius: 10px;
        }
        #error-icon img{
            width: 25px;
            filter: brightness(0) saturate(100%) invert(63%) sepia(88%) saturate(4528%) hue-rotate(330deg) brightness(93%) contrast(96%);
        }
        #error-text{
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #error-label{
            color: #e84a4a;
            font-weight: bolder;
            font-size: 16px;
        }
        #error-content{
            font-size: 13px;
        }
        #draw-con{
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }
        #upload-con{
            position: relative;
        }
        #draw-con::before{
            content: "Start Drawing";
            background-color: #a551ff;
            color: white;
            position: absolute;
            z-index: -1;
            height: 50px;
            top: -40px;
            width: 100%;
            border: 2px solid #a551ff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            padding-top: 5px;
        }
        #upload-con::before{
            content: "Convert Image to Pixel Art";
            background-color: #a551ff;
            color: white;
            position: absolute;
            z-index: -1;
            height: 50px;
            top: -40px;
            width: 100%;
            border: 2px solid #a551ff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            padding-top: 5px;
        }
        .file-btn{
            background-color: #a551ff2f;
            transition: 0.1s;
            padding: 10px;
            border: 2px solid #a551ff;
            outline: none;
            color: #b775ff;
            font-weight: 600;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            display: flex;
            gap: 10px;
            
        }
        .file-btn img{
            height: 20px;
            filter: brightness(0) saturate(100%) invert(41%) sepia(46%) saturate(4462%) hue-rotate(244deg) brightness(99%) contrast(110%);
        }
        .file-btn:hover img{
            filter: brightness(0) saturate(100%) invert(100%) sepia(100%) saturate(0%) hue-rotate(288deg) brightness(102%) contrast(102%);

        }
        .file-btn:hover{
            background-color: #a551ff;
            color: white
        }
        #intro{
            margin-left: 18%;
        }
        #intro h2{
            font-family: 'Pixelify Sans', sans-serif;
            font-size: 42px;
        }
        #intro p{
            font-size: 17px;
        }
        .cover{
            width: 100%;
            height: 100%;
            background: #00000081;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.15s;
        }
        .popedup{
            opacity: 1;
            pointer-events: auto;
        }
        #new-ui{
            background-color: #181c1f;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #2d3033;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .ui-con{
            display: flex;
            flex-direction: row;
            gap: 10px;
            font-size: 16px;
            align-items: center;
        }
        #file-name, #file-width, #file-height{
            background-color: #212629;
            border: none;
            border-radius: 10px;
            padding: 10px;
            min-width: 150px;
            display: flex;
            align-items: center;
            justify-content: end;
            flex: 1;
        }
        #create-file{
            padding: 10px;
            background-color: #a551ff;
            border-radius: 10px;
            border: none;
            outline: none;
            font-weight: 600;
            cursor: pointer;
        }
        hr{
            border: 1px solid #4b4d4e;
        }
    </style>
</head>
<body>
    <div id="logo">
        <img src="assets/logo.png">
        Raster Draw
    </div>
    <div class="page">
        <div id="intro">
            <h2>Porfessional free pixel art app</h2>
            <p>Draw your pixel art from scratch of convert an existing image to pixel art</p>
        </div>
        <div id="tools">
            <div id="draw-con" class="con">
                <input onchange="uploadFile(this)" type="file" id="upload-file" style="display: none;" accept=".rasart">
                <button class="file-btn" id="new-file" onclick="document.querySelector('#new-ui').parentElement.classList.add('popedup')"><img src="assets/Add.svg">Create new Project</button>
                <button class="file-btn" id="upload-file" onclick="document.querySelector('#upload-file').click()"><img src="assets/Upload.svg">Upload an existing project (.rasart)</button>
            </div>
            <div id="upload-con" class="con">
                <input onchange="uploadImage(this)" type="file" style="display: none;" accept=".png, .jpg, .jpeg, .webp, .avif, .gif, .svg">
                <div id="upload" onclick="document.querySelector('#upload-con').querySelector('input').click()">
                    <img src="assets/Clip.svg">
                    Choose a file or drag and drop it here
                </div>
            </div>
        </div>
    </div>
    <div class="cover" onclick="if (event.target == this) {this.classList.remove('popedup')}">
        <div id="new-ui">
            <div class="ui-con" style="justify-content: space-between;">
                <p style="font-size: 18px; font-weight: 600;">New Project</p>
                <button id="close" onclick="this.parentElement.parentElement.parentElement.classList.remove('popedup')"><img src="assets/Close.svg"></button>
            </div>
            <hr>
            <div class="ui-con"><input type="text" id="file-name" placeholder="Project name" oninput="checkChars(this)">.rasart</div>
            <div class="ui-con">
                Width : <input type="number" id="file-width" placeholder="Width"> px
                <space></space>
                Height : <input type="number" id="file-height" placeholder="Height"> px
            </div>
            <button id="create-file" onclick="createFile()">Create Project</button>
        </div>
    </div>
    <div id="error">
        <div id="error-icon"><img src="assets/Error.svg"></div>
        <div id="error-text">
            <p id="error-label">Error!</p>
            <p id="error-content"></p>
        </div>
        <button id="close" onclick="document.querySelector('#error').style.translate = 'calc(100% + 15px) 0px'"><img src="assets/Close.svg"></button>
    </div>
    <script>
        var upload = document.querySelector("#upload")
        var forbiddenChars = ['/', '\\', ':', '*', '"', '?', '<', '>', '|']
        var allowed_extentions = ["image/png", "image/jpg", "image/jpeg", "image/webp", "image/avif", "image/gif", "image/svg+xml"]
        upload.addEventListener("dragover", (e) => {
            e.preventDefault()
            upload.classList.add("dragging")
        })
        upload.addEventListener("dragleave", (e) => {
            upload.classList.remove("dragging")
        })
        upload.addEventListener("drop", (e) =>{
            e.preventDefault()
            upload.classList.remove("dragging")
            var files = e.dataTransfer.files
            if (files.length < 1) {

            }
            else if (files.length > 1) {
                showError("Please select only one image", 5)
            }
            else if (!allowed_extentions.includes(files[0].type)) {
                showError("This file type is not supported! If it is an image, please convert it to another format", 10)
            }
            else {
                goToConvert(files[0])
            }
        })
        function checkChars(element) {
            var initText = element.value
            forbiddenChars.forEach(char => {
                element.value = element.value.replaceAll(char, "")
            })
            if (element.value != initText) {
                showError("Project name can't contain these characters " + '/ \\ : * " ? < > |', 5)
            }
        }
        function createFile() {
            var width = document.querySelector("#file-width")
            var height = document.querySelector("#file-height")
            var name = document.querySelector("#file-name")
            if (width.value < 1 || height.value < 1) {
                showError("They width and the height can't be less than 1px", 5)
                return
            }
            else if (width.value > 1024 || height.value > 1024) {
                showError("The width and the height can't exceed 1024px", 5)
                return
            }
            if (name.value == "") {
                showError("Please enter a name for the project", 5)
                return
            }
            sessionStorage.setItem("state", "new")
            sessionStorage.setItem("width", width.value)
            sessionStorage.setItem("height", height.value)
            sessionStorage.setItem("name", name.value)
            window.location.href = "drawing.html"
        }
        function uploadFile(element) {
            var file = element.files[0]
            if (file) {
                var request = indexedDB.open("file", 1)
                request.onupgradeneeded = (event) => {
                    var db = event.target.result

                    db.createObjectStore("data", { keyPath: "id" })
                }
                request.onsuccess = (event) => {
                    var db = event.target.result
                    var edit = db.transaction("data", "readwrite")
                    edit.objectStore("data").put({id: 1, file: file})
                    edit.oncomplete = () => {
                        sessionStorage.setItem("state", "upload")
                        window.location.href = "drawing.html"
                    }
                }
            }
        }
        function uploadImage(element) {
            var file = element.files[0]
            if (file) {
                goToConvert(file)
            }
        }
        function showError(text, duration) {
            document.querySelector("#error-content").innerText = text
            document.querySelector("#error").style.translate = "0px 0px"
            setTimeout(() => {
                document.querySelector("#error").style.translate = "calc(100% + 15px) 0px"
            }, duration * 1000)
        }
        function goToConvert(file) {

            var request = indexedDB.open("image", 1)
            request.onupgradeneeded = (event) => {
                var db = event.target.result

                db.createObjectStore("src", { keyPath: "id" })
            }
            request.onsuccess = (event) => {
                var db = event.target.result
                var edit = db.transaction("src", "readwrite")
                edit.objectStore("src").put({id: 1, image: file})
                edit.oncomplete = () => {
                    window.location.href = "convert.html"
                }
            }
            
        }
        
    </script>
</body>
</html>
